version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: quicksync_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: quicksync_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quicksync_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: quicksync_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quicksync_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/quicksync_db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: quicksync_super_secret_jwt_key_998877665544332211
      JWT_REFRESH_SECRET: quicksync_super_secret_refresh_jwt_key_1122334455
      QUICKCOMMERCE_BASE_URL: https://api.quickcommerceapi.com
      QUICKCOMMERCE_API_KEY: ${QUICKCOMMERCE_API_KEY:-}
      DEFAULT_CITY: Bangalore
      DEFAULT_AREA: Indiranagar
      DEFAULT_LATITUDE: 12.9716
      DEFAULT_LONGITUDE: 77.5946
      DEFAULT_PINCODE: 560001
      SYNC_INTERVAL_SECONDS: 60
      API_TIMEOUT_SECONDS: 15
      MAX_RETRIES: 3
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quicksync_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
